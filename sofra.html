<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وصفة اليوم وسفرة اليوم | AQX Food</title>
<meta name="description" content="وصفة اليوم وسفرة اليوم من مطبخ القرماني AQX: سفرة متكاملة وقائمة تسوق جاهزة لكل يوم.">
<meta name="theme-color" content="#0d4a3e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/sofra.css">
</head>
<body>

<header class="topbar" id="topbar">
  <a class="brand" href="https://aqxfood.blogspot.com/" aria-label="AQX Food">
    <span class="brand-mark">AQX</span><span class="brand-name">مطبخ القرماني</span>
  </a>
  <nav class="topnav">
    <a href="#today">اليوم</a>
    <a href="#calendar">التقويم</a>
    <a href="#sections">الأقسام</a>
    <a href="https://aqxfood.blogspot.com/" class="ext">المدونة ↗</a>
  </nav>
  <button class="cart-btn" id="cartOpen" aria-label="قائمة التسوق">🛒 <span>قائمة التسوق</span><b id="cartCount">0</b></button>
</header>

<!-- ================= HERO ================= -->
<section class="hero" id="hero">
  <div class="stars" aria-hidden="true"></div>
  <div class="lanterns" id="lanterns" aria-hidden="true"></div>
  <div class="hero-inner">
    <p class="eyebrow" id="heroEyebrow">﷽</p>
    <h1 class="hero-title"><span class="gold-text">وصفة اليوم</span><i>|</i><span class="gold-text">سفرة اليوم</span></h1>
    <p class="hero-sub" id="heroSub">مساعدك المطبخي اليومي — سفرة متكاملة وخطة تحضير وقائمة تسوق</p>
    <div class="hero-date" id="heroDate"></div>
    <a href="#today" class="cta">ابدأ سفرة اليوم <span>↓</span></a>
  </div>
  <svg class="hero-wave" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0,40 C240,90 480,0 720,40 C960,80 1200,10 1440,40 L1440,80 L0,80 Z"/></svg>
</section>

<main>
<!-- ============ DAY CONTROLS ============ -->
<section class="shell" id="calendar">
  <div class="ornate-title"><span></span><h2>اختر الشهر واليوم</h2><span></span></div>
  <div class="months" id="monthTabs" role="tablist"></div>
  <div class="days" id="dayGrid"></div>
</section>

<!-- ============ TODAY ============ -->
<section class="shell" id="today">
  <div class="view-switch" role="tablist">
    <button class="vs-btn active" data-view="recipe" role="tab">🍽️ وصفة اليوم</button>
    <button class="vs-btn" data-view="sofra" role="tab">🍲 سفرة اليوم</button>
  </div>

  <div id="viewRecipe" class="view"></div>
  <div id="viewSofra" class="view" hidden></div>
</section>

<!-- ============ BLOGGER SECTIONS ============ -->
<section class="shell" id="sections">
  <div class="ornate-title"><span></span><h2>من أقسام المدونة</h2><span></span></div>
  <div class="section-tabs" id="sectionTabs"></div>
  <div class="post-grid" id="postGrid"></div>
  <div class="center"><a id="sectionMore" class="btn-ghost" href="https://aqxfood.blogspot.com/" target="_blank" rel="noopener">عرض كل القسم ↗</a></div>
</section>
</main>

<footer class="footer">
  <div class="footer-orn" aria-hidden="true">✦ ✦ ✦</div>
  <p>AQX Food 💎 مطبخ القرماني — كل يوم سفرة أجمل</p>
  <p class="muted"><a href="https://aqxfood.blogspot.com/">aqxfood.blogspot.com</a></p>
</footer>

<!-- ============ SHOPPING DRAWER ============ -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h3>🛒 قائمة التسوق</h3>
    <button class="icon-btn" id="cartClose" aria-label="إغلاق">✕</button>
  </div>
  <div class="drawer-days" id="cartDays"></div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot">
    <button class="btn-gold" id="cartShare">إرسال واتساب</button>
    <button class="btn-ghost" id="cartCopy">نسخ</button>
    <button class="btn-ghost" id="cartPrint">طباعة</button>
    <button class="btn-link" id="cartClear">تفريغ</button>
  </div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/blogger.js"></script>
<script src="js/shopping.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
